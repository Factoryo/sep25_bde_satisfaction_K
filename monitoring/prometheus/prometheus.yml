# Configuration Prometheus pour le monitoring du projet
# Collecte des métriques de l'API, ML API, et infrastructure

global:
  scrape_interval: 15s      # Fréquence de collecte des métriques
  evaluation_interval: 15s   # Fréquence d'évaluation des règles
  external_labels:
    cluster: 'trustpilot-analytics'
    environment: 'production'

# Configuration des alertes
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Règles d'alertes
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Configuration du scraping des métriques
scrape_configs:
  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API principale (données)
  - job_name: 'api-data'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ML API (prédictions)
  - job_name: 'ml-api'
    static_configs:
      - targets: ['ml-api:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Dashboard Streamlit
  - job_name: 'dashboard'
    static_configs:
      - targets: ['dashboard:8501']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Elasticsearch Exporter
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch-exporter:9114']

  # Node Exporter (métriques système)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor (métriques Docker)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
