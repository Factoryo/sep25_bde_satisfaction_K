groups:
  - name: api_alerts
    interval: 30s
    rules:
      - alert: APIDown
        expr: up{job="api-data"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "API principale est DOWN"
          description: "L'API sur le port 8000 ne répond plus depuis {{ $value }} minutes"

      - alert: MLAPIDown
        expr: up{job="ml-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: ml-api
        annotations:
          summary: "ML API est DOWN"
          description: "L'API ML sur le port 8001 ne répond plus depuis {{ $value }} minutes"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Taux d'erreur élevé détecté"
          description: "Le taux d'erreur 5xx est de {{ $value | humanizePercentage }} sur les 5 dernières minutes"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Latence élevée détectée"
          description: "Le P95 de la latence est de {{ $value }}s sur les 5 dernières minutes"

  - name: ml_alerts
    interval: 30s
    rules:
      - alert: MLModelNotLoaded
        expr: ml_model_loaded == 0
        for: 2m
        labels:
          severity: critical
          service: ml-api
        annotations:
          summary: "Modèle ML non chargé"
          description: "Le modèle ML n'est pas chargé dans l'API"

      - alert: LowPredictionConfidence
        expr: avg(ml_prediction_confidence) < 0.70
        for: 15m
        labels:
          severity: warning
          service: ml-api
        annotations:
          summary: "Confiance des prédictions faible"
          description: "La confiance moyenne des prédictions est de {{ $value | humanizePercentage }}"

      - alert: DataDriftDetected
        expr: data_drift_detected == 1
        for: 1m
        labels:
          severity: warning
          service: ml-monitoring
        annotations:
          summary: "Data Drift détecté"
          description: "Une dérive des données a été détectée. Réentraînement du modèle recommandé"

  - name: infrastructure_alerts
    interval: 1m
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Utilisation CPU élevée"
          description: "L'utilisation CPU est de {{ $value }}% sur {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Utilisation mémoire élevée"
          description: "L'utilisation mémoire est de {{ $value }}% sur {{ $labels.instance }}"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Espace disque faible"
          description: "Seulement {{ $value }}% d'espace disque disponible sur {{ $labels.instance }}"

  - name: database_alerts
    interval: 1m
    rules:
      - alert: ElasticsearchDown
        expr: up{job="elasticsearch"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Elasticsearch est DOWN"
          description: "Elasticsearch ne répond plus"

      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL est DOWN"
          description: "PostgreSQL ne répond plus"

      - alert: PostgreSQLTooManyConnections
        expr: sum(pg_stat_activity_count) > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Trop de connexions PostgreSQL"
          description: "{{ $value }} connexions actives (limite: 100)"
