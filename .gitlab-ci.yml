stages:
  - test
  - build

variables:
  DOCKER_DRIVER: overlay2

# Tests Python
test:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt
    - pip install pytest flake8
  script:
    - flake8 api/ scripts/ --max-line-length=120 --exclude=.venv
    - pytest tests/ -v
  only:
    - main
    - merge_requests

# Build des images Docker
build:api:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA -f docker/Dockerfile.api .
    - docker push $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA
  only:
    - main

build:ml-api:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/ml-api:$CI_COMMIT_SHORT_SHA -f docker/Dockerfile.ml-api .
    - docker push $CI_REGISTRY_IMAGE/ml-api:$CI_COMMIT_SHORT_SHA
  only:
    - main

build:dashboard:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/dashboard:$CI_COMMIT_SHORT_SHA -f docker/Dockerfile.dashboard .
    - docker push $CI_REGISTRY_IMAGE/dashboard:$CI_COMMIT_SHORT_SHA
  only:
    - main
