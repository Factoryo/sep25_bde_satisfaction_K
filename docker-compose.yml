version: '3.8'

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    depends_on:
      - elasticsearch
    volumes:
      - ./api:/app/api
      - ./data:/app/data
    networks:
      - app-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=trustpilot_db
      - POSTGRES_USER=trustpilot_user
      - POSTGRES_PASSWORD=trustpilot_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./etl_elt/scripts/postgres_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustpilot_user -d trustpilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - app-network

  # Kibana (optional - for Elasticsearch visualization)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - app-network

  # Dashboard (Streamlit)
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8502:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ./dashboard:/app/dashboard
    networks:
      - app-network

  # ML API (Machine Learning predictions)
  ml-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml-api
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - api
    volumes:
      - ./api:/app/api
      - ./scripts/ml/models:/app/scripts/ml/models:ro
    networks:
      - app-network
    restart: unless-stopped

volumes:
  elasticsearch-data:
  postgres-data:

networks:
  app-network:
    driver: bridge
